<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для Сонячки💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  margin: 0; padding: 0;
  font-family: 'Press Start 2P', monospace;
  background: #ffe6f0;
  overflow: hidden;
  height: 100vh; width: 100vw;
}

#bg {
  position: absolute; top:0; left:0; width: 100%; height: 100%;
  background-image: radial-gradient(#ffb3d1 15%, transparent 15%);
  background-size: 40px 40px;
  z-index: 1;
}

#heart {
  position: absolute; font-size: 50px;
  cursor: pointer; z-index: 9999;
  user-select: none; line-height: 1;
}

#textBox {
  position: absolute; top: 45%; left: 50%;
  transform: translate(-50%, -50%);
  width: 85%; text-align: center;
  font-size: 14px; color: #330000;
  z-index: 10; pointer-events: none;
  line-height: 1.8; white-space: pre-line;
}

#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255, 230, 240, 0.95);
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 10000; padding: 20px; box-sizing: border-box;
}

.btn {
  margin: 5px; padding: 10px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px; border: 4px solid #330000;
  background: #ffb3d1; color: #330000;
  cursor: pointer; width: 100%; max-width: 320px;
}

#footerText {
  position: absolute; bottom: 15px; right: 15px;
  font-size: 9px; color: #ff4d6d; z-index: 100;
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="heart">💗</div>
<div id="textBox">Поймай моё сердечко...</div>
<div id="overlay"></div>
<div id="footerText">special for София Мяуковна</div>
