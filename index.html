<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для Сонячки💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  margin: 0; padding: 0;
  font-family: 'Press Start 2P', monospace;
  background: #ffe6f0;
  overflow: hidden;
  height: 100vh; width: 100vw;
}

#bg {
  position: absolute; top:0; left:0; width: 100%; height: 100%;
  background-image: radial-gradient(#ffb3d1 15%, transparent 15%);
  background-size: 40px 40px; z-index: 1;
}

#heart {
  position: absolute; font-size: 50px; cursor: pointer;
  z-index: 9999; user-select: none; line-height: 1;
}

#textBox {
  position: absolute; top: 40%; left: 50%;
  transform: translate(-50%, -50%);
  width: 85%; text-align: center; font-size: 14px;
  color: #330000; z-index: 10; pointer-events: none;
  line-height: 1.8;
}

.sub-text {
  color: rgba(51, 0, 0, 0.5); 
  font-size: 10px; display: block; margin-top: 10px;
}

#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255, 230, 240, 0.95);
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 10000; padding: 15px; box-sizing: border-box;
}

.btn {
  margin: 6px; padding: 12px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px; border: 4px solid #330000;
  background: #ffb3d1; color: #330000;
  cursor: pointer; width: 100%; max-width: 350px;
}

#footerText {
  position: absolute; bottom: 15px; right: 15px;
  font-size: 9px; color: #ff4d6d; z-index: 100;
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="heart">💗</div>

<div id="textBox">янянянянянянян</div>

<div id="overlay"></div>
<div id="footerText">special for София Мяуковна</div>

<script>
const heart = document.getElementById('heart');
const textBox = document.getElementById('textBox');
const overlay = document.getElementById('overlay');

let milotaDone = false;
let pravdaDone = false;

let posX = Math.random() * (window.innerWidth - 70);
let posY = Math.random() * (window.innerHeight - 70);
let dx = 2.5; let dy = 2.5;

function move() {
  posX += dx; posY += dy;
  if (posX <= 0 || posX >= window.innerWidth - 60) dx *= -1;
  if (posY <= 0 || posY >= window.innerHeight - 60) dy *= -1;
  heart.style.left = posX + 'px'; heart.style.top = posY + 'px';
  requestAnimationFrame(move);
}
move();

function type(text, isSubText = false, cb) {
  if (!isSubText) textBox.innerHTML = '';
  let i = 0;
  const container = isSubText ? document.createElement('span') : textBox;
  if (isSubText) {
    container.className = 'sub-text';
    textBox.appendChild(container);
  }
  
  const t = setInterval(() => {
    container.innerHTML += text[i];
    i++;
    if(i >= text.length) {
      clearInterval(t);
      document.body.onclick = () => {
        document.body.onclick = null;
        if(cb) cb();
      };
    }
  }, 60);
}

heart.onclick = (e) => {
  e.stopPropagation();
  heart.style.display = 'none';
  type('ой, ты поймала мое сердечко!', false, () => {
    type('ну... хорошо... можешь оставить его у себя', false, () => {
       type('(пожалуйста)', true, () => showMenu());
    });
  });
};

function showMenu() {
  if (milotaDone && pravdaDone) {
    // 2. ИСПРАВЛЕНО: Добавлено сердечко в финал
    textBox.innerHTML = "конец! надеюсь тебе эта игра понравилась и подняла настроение, я очень старался 💓";
    return;
  }
  overlay.style.display = 'flex';
  overlay.innerHTML = '<p style="color:#330000; margin-bottom:15px;">Выбери:</p>';
  if(!milotaDone) addBtn('милота', () => startQuest('милота'));
  if(!pravdaDone) addBtn('правда', () => startQuest('правда'));
}

function addBtn(txt, fn) {
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = txt; b.onclick = fn;
  overlay.appendChild(b);
}

function startQuest(typeQuest) {
  overlay.style.display = 'none';
  if(typeQuest === 'милота') {
    ask('как думаешь, что я сейчас делаю?', [
      {t:'1. бездельничаю', r:'неее'},
      {t:'2. сплю', r:'без тебя не хочу'},
      {t:'3. рисую', r:'седня не'},
      {t:'4. думаю о тебе', r:'ну конечно!! умничка.', c:true}
    ], () => { milotaDone = true; showMenu(); });
  } else {
    ask('как думаешь, что я люблю больше всего на свете?', [
      {t:'1. собачек', r:'я и вправду их очень люблю, но не больше всего'},
      // 3. ИСПРАВЛЕНО: фраза про культуру теперь полная
      {t:'2. немецкую культуру', r:'она конечно мне очень нравится, да вот только есть кое что получше нее)'},
      {t:'3. белого монстра', r:'он вкусный, но вредный'},
      {t:'4. слушать твои гски', r:'в точку. я просто обожаю твой твой голос, это лучшее что я когда либо слышал', c:true}
    ], () => { pravdaDone = true; showMenu(); });
  }
}

function ask(q, opts, cb) {
  overlay.style.display = 'flex';
  overlay.innerHTML = `<p style="color:#330000; padding:10px; text-align:center; font-size:11px;">${q}</p>`;
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = o.t;
    b.onclick = () => {
      overlay.style.display = 'none';
      type(o.r, false, () => o.c ? cb() : ask(q, opts, cb));
    };
    overlay.appendChild(b);
  });
}
</script>
</body>
</html>
