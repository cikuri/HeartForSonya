<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>для Сонячки💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  background: #ffe6f0;
  overflow: hidden;
  height: 100vh;
  user-select: none;
  position: relative;
}

#bg {
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: 
    radial-gradient(pink 10%, transparent 10%), 
    radial-gradient(pink 10%, transparent 10%);
  background-size: 50px 50px;
  background-position: 0 0, 25px 25px;
  animation: moveBG 60s linear infinite;
  z-index: -1;
}

@keyframes moveBG {
  0% { transform: translate(0,0); }
  100% { transform: translate(-50px,-50px); }
}

svg#heart {
  width: 80px;
  height: 80px;
  position: absolute;
  cursor: pointer;
  transform-origin: center center;
  z-index: 2;
}

#textBox {
  position: absolute;
  bottom: 15%;
  width: 80%;
  text-align: center;
  font-size: 1.2em;
  color: #330000;
  pointer-events: none;
  white-space: pre-line;
  font-family: 'Press Start 2P', monospace;
}

#overlay {
  position: absolute;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.3);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-size: 1.5em;
  flex-direction: column;
  display: none;
}

.btn {
  margin: 10px;
  padding: 12px 24px;
  font-size: 1em;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: pink;
  color: #330000;
}

#footerText {
  position: absolute;
  bottom: 5px;
  right: 10px;
  font-size: 0.6em;
  color: #330000;
}

.finalText {
  font-family: 'Press Start 2P', monospace;
  font-size: 1.2em;
}

</style>
</head>
<body>

<div id="bg"></div>

<svg id="heart" viewBox="0 0 32 29.6">
  <path fill="pink" d="M23.6,0C21.4,0,19.4,1.2,18,3C16.6,1.2,14.6,0,12.4,0C7.6,0,4,3.6,4,8.4c0,5.7,12,16.6,12,16.6s12-10.9,12-16.6C28,3.6,24.4,0,23.6,0z"/>
</svg>

<div id="textBox"></div>
<div id="overlay"></div>
<div id="footerText">special for София Мяуковна</div>

<script>
const heart = document.getElementById('heart');
const textBox = document.getElementById('textBox');
const overlay = document.getElementById('overlay');

let step = 0;
let milotaDone = false;
let pravdaDone = false;

function typeText(text, callback) {
  textBox.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    textBox.textContent += text[i];
    i++;
    if(i>=text.length){ clearInterval(interval); if(callback) callback(); }
  }, 66);
}

// движение сердца
let heartX = Math.random()*(window.innerWidth-80);
let heartY = Math.random()*(window.innerHeight-80);
let targetX = heartX;
let targetY = heartY;
let angle = 0;

function moveHeart() { 
  targetX = Math.random()*(window.innerWidth-80);
  targetY = Math.random()*(window.innerHeight-80);
}
function animateHeart() {
  heartX += (targetX-heartX)*0.02;
  heartY += (targetY-heartY)*0.02;
  angle = Math.sin(Date.now()/200)*10;
  heart.style.left = heartX+'px';
  heart.style.top = heartY+'px';
  heart.style.transform = `rotate(${angle}deg)`;
  requestAnimationFrame(animateHeart);
}

animateHeart();
setInterval(moveHeart, 3000);

heart.onclick = ()=>{ nextStep(); heart.style.display='none'; }
function nextStep(){
  step++;
  if(step===1){
    overlay.style.display='none';
    typeText('ой, ты поймала мое сердечко!', ()=>{
      document.body.onclick = ()=>{ nextStep(); document.body.onclick=null; };
    });
  } else if(step===2){
    typeText('ну... хорошо... можешь оставить его у себя\n(пожалуйста)', ()=>{
      document.body.onclick = ()=>{ showChoices(); document.body.onclick=null; };
    });
  }
}

function showChoices(){
  textBox.textContent='';
  overlay.style.display='flex';
  overlay.innerHTML = `
    <div>Выбери:</div>
    <button class="btn" onclick="question('милота')">милота</button>
    <button class="btn" onclick="question('правда')">правда</button>
  `;
}

function question(type){
  overlay.style.display='none';
  overlay.innerHTML='';
  if(type==='милота'){
    askQuestion('как думаешь, что я сейчас делаю?', [
      {text:'бездельничаю', resp:'неее'},
      {text:'сплю', resp:'без тебя не хочу'},
      {text:'рисую', resp:'седня не'},
      {text:'думаю о тебе', resp:'ну конечно!! умничка.', correct:true}
    ], ()=>{ milotaDone=true; checkFinal(); });
  } else if(type==='правда'){
    askQuestion('как думаешь, что я люблю больше всего на свете?', [
      {text:'собачек', resp:'я и вправду их очень люблю, но не больше всего'},
      {text:'немецкую культуру', resp:'она конечно мне очень нравится, только есть кое что получше'},
      {text:'белого монстра', resp:'он вкусный, но вредный'},
      {text:'слушать твои гски', resp:'в точку. я просто обожаю твой твой голос, это лучшее что я когда либо слышал', correct:true}
    ], ()=>{ pravdaDone=true; checkFinal(); });
  }
}

function askQuestion(questionText, options, callback){
  overlay.style.display='flex';
  overlay.innerHTML = `<div>${questionText}</div>`;
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='btn';
    btn.textContent=opt.text;
    btn.onclick=()=>{
      overlay.style.display='none';
      typeText(opt.resp, ()=>{
        document.body.onclick = ()=>{
          document.body.onclick=null;
          if(!opt.correct){
            overlay.style.display='flex';
            askQuestion(questionText, options, callback);
          } else {
            showChoices(); 
          }
        };
      });
      if(opt.correct) callback();
    };
    overlay.appendChild(btn);
  });
}

// финальный текст
function checkFinal(){
  if(milotaDone && pravdaDone){
    typeText('ᴋонᴇц! нᴀдᴇюᴄь ᴛᴇбᴇ ϶ᴛᴀ иᴦᴩᴀ ᴨонᴩᴀʙиᴧᴀᴄь и ᴨодняᴧᴀ нᴀᴄᴛᴩоᴇниᴇ, я очᴇнь ᴄᴛᴀᴩᴀᴧᴀᴄь');
  }
}
</script>
</body>
</html>
