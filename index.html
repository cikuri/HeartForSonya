<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Софии 💖</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ffe6f0, #fff0e6);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  #heart {
    width: 80px;
    height: 80px;
    background: red;
    clip-path: polygon(
      50% 0%, 61% 11%, 75% 10%, 88% 23%, 88% 39%, 
      75% 57%, 50% 80%, 25% 57%, 12% 39%, 12% 23%, 
      25% 10%, 39% 11%
    );
    position: absolute;
    cursor: pointer;
    transition: all 1s ease;
  }

  #textBox {
    position: absolute;
    bottom: 15%;
    width: 80%;
    text-align: center;
    font-size: 1.4em;
    color: #330000;
    pointer-events: none;
    white-space: pre-line;
  }

  #overlay {
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 1.5em;
    flex-direction: column;
    display: none;
  }

  .btn {
    margin: 10px;
    padding: 12px 24px;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: pink;
    color: #330000;
  }

  #footerText {
    position: absolute;
    bottom: 5px;
    right: 10px;
    font-size: 0.8em;
    color: #330000;
  }

</style>
</head>
<body>

<div id="heart"></div>
<div id="textBox"></div>
<div id="overlay"></div>
<div id="footerText">for София Мяуковна</div>

<script>
const heart = document.getElementById('heart');
const textBox = document.getElementById('textBox');
const overlay = document.getElementById('overlay');

let step = 0;

function typeText(text, callback) {
  textBox.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    textBox.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if(callback) callback();
    }
  }, 50);
}

function moveHeart() {
  const x = Math.random() * (window.innerWidth - 80);
  const y = Math.random() * (window.innerHeight - 80);
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
}

// плавное движение каждые 2 секунды
setInterval(moveHeart, 2000);
moveHeart();

// шаги при кликах
function nextStep() {
  step++;
  if(step === 1) {
    overlay.style.display = 'none';
    typeText('ой, ты поймала мое сердечко!', () => {
      document.body.onclick = () => { nextStep(); document.body.onclick = null; };
    });
  } else if(step === 2) {
    typeText('ну.. хорошо.. можешь оставить его у себя\n(пожалуйста)', () => {
      document.body.onclick = () => { showChoices(); document.body.onclick = null; };
    });
  }
}

// показать кнопки "правда" / "милота"
function showChoices() {
  textBox.textContent = '';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div>Выбери:</div>
    <button class="btn" onclick="question('милота')">милота</button>
    <button class="btn" onclick="question('правда')">правда</button>
  `;
}

// логика вопросов
function question(type) {
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  if(type === 'милота') {
    askQuestion('как думаешь, что я сейчас делаю?', [
      {text:'бездельничаю', resp:'неее'},
      {text:'сплю', resp:'без тебя не хочу'},
      {text:'рисую', resp:'седня не'},
      {text:'думаю о тебе', resp:'ну конечно!! умничка.'}
    ], () => showChoices());
  } else if(type === 'правда') {
    askQuestion('как думаешь, что я люблю больше всего на свете?', [
      {text:'собачек', resp:'я и вправду их очень люблю, но не больше всего'},
      {text:'немецкую культуру', resp:'она конечно мне очень нравится, только есть кое что получше'},
      {text:'белого монстра', resp:'он вкусный, но вредный'},
      {text:'слушать твои гски', resp:'в точку. я просто обожаю твой твой голос, это лучшее что я когда либо слышал'}
    ], () => showChoices());
  }
}

// функция показа вопроса с вариантами
function askQuestion(questionText, options, callback) {
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div>${questionText}</div>`;
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = opt.text;
    btn.onclick = () => {
      overlay.style.display = 'none';
      typeText(opt.resp, () => {
        if(opt.text.includes('думаю о тебе') || opt.text.includes('гски')) {
          showChoices();
        } else {
          askQuestion(questionText, options, callback);
        }
      });
    };
    overlay.appendChild(btn);
  });
}

// клик по сердечку
heart.onclick = () => { 
  nextStep(); 
  heart.style.display = 'none'; 
}
</script>

</body>
</html>
