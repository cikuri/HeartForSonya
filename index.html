<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для Сонячки💖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    margin: 0;
    font-family: 'Press Start 2P', monospace;
    background: #ffe6f0;
    overflow: hidden;
    height: 100vh;
    user-select: none;
    position: relative;
  }

  /* фон с сердечками */
  #bg {
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: 
      radial-gradient(pink 10%, transparent 10%), 
      radial-gradient(pink 10%, transparent 10%);
    background-size: 50px 50px;
    background-position: 0 0, 25px 25px;
    animation: moveBG 60s linear infinite;
    z-index: -1;
  }

  @keyframes moveBG {
    0% { transform: translate(0,0); }
    100% { transform: translate(-50px,-50px); }
  }

  #heart {
    width: 80px;
    height: 80px;
    background: pink;
    clip-path: polygon(
      50% 0%, 61% 11%, 75% 10%, 88% 23%, 88% 39%, 
      75% 57%, 50% 80%, 25% 57%, 12% 39%, 12% 23%, 
      25% 10%, 39% 11%
    );
    position: absolute;
    cursor: pointer;
    transition: transform 0.05s linear;
  }

  #textBox {
    position: absolute;
    bottom: 15%;
    width: 80%;
    text-align: center;
    font-size: 1.2em;
    color: #330000;
    pointer-events: none;
    white-space: pre-line;
  }

  #overlay {
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 1.5em;
    flex-direction: column;
    display: none;
  }

  .btn {
    margin: 10px;
    padding: 12px 24px;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: pink;
    color: #330000;
  }

  #footerText {
    position: absolute;
    bottom: 5px;
    right: 10px;
    font-size: 0.8em;
    color: #330000;
  }

  /* стиль для финального текста */
  .finalText {
    font-family: monospace;
  }

</style>
</head>
<body>

<div id="bg"></div>
<div id="heart"></div>
<div id="textBox"></div>
<div id="overlay"></div>
<div id="footerText">special for София Мяуковна</div>

<script>
const heart = document.getElementById('heart');
const textBox = document.getElementById('textBox');
const overlay = document.getElementById('overlay');

let step = 0;
let milotaDone = false;
let pravdaDone = false;

// функция для печатающего текста с замедлением на 33%
function typeText(text, callback, isFinal=false) {
  textBox.textContent = '';
  if(isFinal) textBox.classList.add('finalText');
  let i = 0;
  const interval = setInterval(() => {
    textBox.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if(callback) callback();
    }
  }, 66); // медленнее
}

// плавное движение сердца без остановок
let heartX = Math.random() * (window.innerWidth - 80);
let heartY = Math.random() * (window.innerHeight - 80);
let targetX = heartX;
let targetY = heartY;

function moveHeart() {
  targetX = Math.random() * (window.innerWidth - 80);
  targetY = Math.random() * (window.innerHeight - 80);
}

function animateHeart() {
  heartX += (targetX - heartX) * 0.02;
  heartY += (targetY - heartY) * 0.02;
  heart.style.left = heartX + 'px';
  heart.style.top = heartY + 'px';
  requestAnimationFrame(animateHeart);
}

heart.onclick = () => { nextStep(); heart.style.display='none'; }

animateHeart();
setInterval(moveHeart, 3000); // новая цель каждые 3 сек

// шаги при кликах
function nextStep() {
  step++;
  if(step === 1) {
    overlay.style.display = 'none';
    typeText('ой, ты поймала мое сердечко!', () => {
      document.body.onclick = () => { nextStep(); document.body.onclick = null; };
    });
  } else if(step === 2) {
    typeText('ну.. хорошо.. можешь оставить его у себя\n(пожалуйста)', () => {
      document.body.onclick = () => { showChoices(); document.body.onclick = null; };
    });
  }
}

// показать кнопки "правда"/"милота"
function showChoices() {
  textBox.textContent = '';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div>Выбери:</div>
    <button class="btn" onclick="question('милота')">милота</button>
    <button class="btn" onclick="question('правда')">правда</button>
  `;
}

// логика вопросов
function question(type) {
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  if(type === 'милота') {
    askQuestion('как думаешь, что я сейчас делаю?', [
      {text:'бездельничаю', resp:'неее'},
      {text:'сплю', resp:'без тебя не хочу'},
      {text:'рисую', resp:'сегодня не'},
      {text:'думаю о тебе', resp:'ну конечно!! умничка.', correct:true}
    ], () => { milotaDone = true; checkFinal(); });
  } else if(type === 'правда') {
    askQuestion('как думаешь, что я люблю больше всего на свете?', [
      {text:'собачек', resp:'я и вправду их очень люблю, но не больше всего'},
      {text:'немецкую культуру', resp:'она конечно мне очень нравится, только есть кое что получше'},
      {text:'белого монстра', resp:'он вкусный, но вредный'},
      {text:'слушать твои гски', resp:'в точку. я просто обожаю твой твой голос, это лучшее что я когда либо слышал', correct:true}
    ], () => { pravdaDone = true; checkFinal(); });
  }
}

function askQuestion(questionText, options, callback) {
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div>${questionText}</div>`;
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = opt.text;
    btn.onclick = () => {
      overlay.style.display = 'none';
      typeText(opt.resp, () => {
        document.body.onclick = () => { 
          document.body.onclick = null; 
          overlay.style.display = 'flex'; 
          askQuestion(questionText, options, callback); 
        };
      });
      if(opt.correct) callback();
    };
    overlay.appendChild(btn);
  });
}

// проверка финала
function checkFinal() {
  if(milotaDone && pravdaDone) {
    typeText('ᴋонᴇц! нᴀдᴇюᴄь ᴛᴇбᴇ ϶ᴛᴀ иᴦᴩᴀ ᴨонᴩᴀʙиᴧᴀᴄь и ᴨодняᴧᴀ нᴀᴄᴛᴩоᴇниᴇ, я очᴇнь ᴄᴛᴀᴩᴀᴧᴄя', null, true);
  }
}
</script>
</body>
</html>
